<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Clean rounded background -->
  <rect width="160" height="160" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="3" y="3" width="154" height="154" rx="25" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Stylized "U" letterform - clean, bold, professional -->
  <!-- Left vertical bar -->
  <rect x="38" y="36" width="18" height="68" rx="2" fill="#ffffff"/>
  <!-- Right vertical bar -->
  <rect x="104" y="36" width="18" height="68" rx="2" fill="#ffffff"/>
  <!-- Bottom curve connecting bars -->
  <path d="M38 92 L38 106 C38 122 52 134 80 134 C108 134 122 122 122 106 L122 92 L104 92 L104 106 C104 112 96 118 80 118 C64 118 56 112 56 106 L56 92 Z" fill="#ffffff"/>
  
  <!-- Construction accent bar at bottom -->
  <rect x="38" y="138" width="84" height="5" rx="2.5" fill="url(#accentGrad)"/>
  
  <!-- Small accent dot top-left -->
  <circle cx="47" cy="30" r="3" fill="url(#accentGrad)"/>
</svg>
